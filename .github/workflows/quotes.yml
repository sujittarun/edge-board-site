name: quote snapshot

# Runs on GitHub's machines, so the board no longer depends on a laptop being awake.
# Cron is UTC; NSE trades 09:15-15:30 IST, which is 03:45-10:00 UTC. The window is deliberately
# a little wider than the session so the first and last snapshots of the day are not clipped by
# GitHub's scheduling drift, which can be five to fifteen minutes under load.
on:
  schedule:
    - cron: "*/15 3-10 * * 1-5"
  workflow_dispatch: {}          # so it can be run by hand without waiting for the cron

# Only one snapshot at a time: two overlapping runs would race on the same commit and one would
# fail to push. Newer wins, because a stale snapshot has no value once a fresher one exists.
concurrency:
  group: quotes
  cancel-in-progress: true

permissions:
  contents: write                # it commits quotes.json back to this repo

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch quotes
        run: python fetch_quotes.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- quotes.json; then
            echo "no change - not committing"
            exit 0
          fi
          git config user.name  "edge-board"
          git config user.email "noreply@users.noreply.github.com"
          git add quotes.json
          git commit -m "quotes $(date -u +'%Y-%m-%d %H:%M') UTC"
          # A publish from the laptop can land between checkout and push, so rebase rather than
          # failing the run: the two touch different files and never actually conflict.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
